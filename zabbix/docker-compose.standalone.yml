# Stack "zabbix" — variante Docker Compose (host standalone). Variáveis, portas e uso no README.
# Pré-requisito: crie as redes externas usadas pela stack (ex.: docker network create web; e data/ldap se aplicável).
services:
  zabbix-server:
    restart: unless-stopped
    image: zabbix/zabbix-server-pgsql:${ZABBIX_IMAGE_TAG:-alpine-7.0-latest}
    networks:
    - default
    environment:
    - DB_SERVER_HOST=${ZABBIX_DB_HOST:-db}
    - DB_SERVER_PORT=${ZABBIX_DB_PORT:-5432}
    - POSTGRES_USER=${ZABBIX_DB_USER:-postgres}
    - POSTGRES_PASSWORD=${ZABBIX_DB_PASSWORD}
    - POSTGRES_DB=${ZABBIX_DB_NAME:-zabbix}
    # Acesso externo opcional (publica a porta no host). Descomente se precisar
    # conectar de fora do host. Veja a nota no README sobre segurança.
    # ports:                 # sugestão: 10051 -> porta 10051 do container
    #   - "${ZABBIX_SERVER_PORT:-10051}:10051"
  zabbix-web:
    restart: unless-stopped
    image: zabbix/zabbix-web-nginx-pgsql:${ZABBIX_IMAGE_TAG:-alpine-7.0-latest}
    networks:
    - default
    - web
    environment:
    - ZBX_SERVER_HOST=zabbix-server
    - ZBX_SERVER_PORT=10051
    - DB_SERVER_HOST=${ZABBIX_DB_HOST:-db}
    - DB_SERVER_PORT=${ZABBIX_DB_PORT:-5432}
    - POSTGRES_USER=${ZABBIX_DB_USER:-postgres}
    - POSTGRES_PASSWORD=${ZABBIX_DB_PASSWORD}
    - POSTGRES_DB=${ZABBIX_DB_NAME:-zabbix}
    - PHP_TZ=${ZABBIX_TIMEZONE:-America/Sao_Paulo}
    # Acesso direto opcional (publica a porta no host, sem passar pelo Traefik).
    # Descomente se precisar bypassar o proxy. Veja a nota no README sobre segurança.
    # ports:                 # sugestão: 8166 -> porta 8080 do container
    #   - "${ZABBIX_EXTERNAL_PORT:-8166}:8080"
    labels:
    - traefik.enable=true
    - traefik.http.routers.zabbix.rule=Host(`${ZABBIX_FQDN}`)
    - traefik.http.routers.zabbix.entrypoints=websecure
    - traefik.http.routers.zabbix.tls=true
    - traefik.http.routers.zabbix.tls.certresolver=letsencryptresolver
    - traefik.http.services.zabbix.loadbalancer.server.port=8080
    - caddy=${ZABBIX_FQDN}
    - caddy.reverse_proxy={{upstreams 8080}}
    - traefik.docker.network=${PROXY_NET:-web}
  zabbix-agent:
    restart: unless-stopped
    image: zabbix/zabbix-agent2:${ZABBIX_IMAGE_TAG:-alpine-7.0-latest}
    networks:
    - default
    environment:
    - ZBX_HOSTNAME=Zabbix server
    - ZBX_SERVER_HOST=zabbix-server
  db:
    restart: unless-stopped
    image: postgres:${ZABBIX_DB_IMAGE_TAG:-16-alpine}
    networks:
    - default
    #- data
    environment:
    - POSTGRES_DB=${ZABBIX_DB_NAME:-zabbix}
    - POSTGRES_USER=${ZABBIX_DB_USER:-postgres}
    - POSTGRES_PASSWORD=${ZABBIX_DB_PASSWORD}
    # Acesso externo opcional (publica a porta no host). Descomente se precisar
    # conectar de fora do host. Veja a nota no README sobre segurança.
    # ports:                 # sugestão: 5440 -> porta 5432 do container
    #   - "${ZABBIX_DB_EXTERNAL_PORT:-5440}:5432"
    volumes:
    - db-data:/var/lib/postgresql/data
networks:
  web:
    external: true
    name: ${PROXY_NET:-web}
  data:
    external: true
    name: ${DATA_NET:-data}
  default:
    driver: bridge
volumes:
  db-data:
    driver: local
