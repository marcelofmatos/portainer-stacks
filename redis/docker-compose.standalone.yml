# Stack "redis" — variante Docker Compose (host standalone). Variáveis, portas e uso no README.
# Pré-requisito: crie as redes externas usadas pela stack (ex.: docker network create web; e data/ldap se aplicável).
services:
  redis:
    restart: unless-stopped
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    command:
    - redis-server
    - --maxmemory
    - ${REDIS_MAXMEMORY:-256mb}
    - --maxmemory-policy
    - ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    - --appendonly
    - ${REDIS_APPENDONLY:-yes}
    - --requirepass
    - ${REDIS_PASSWORD:-}
    # Acesso externo opcional (publica a porta no host). CUIDADO: exponha só com senha.
    # ports:                 # sugestão: 6379 -> porta 6379 do container
    #   - "${REDIS_PORT:-6379}:6379"
    volumes:
    - redis-data:/data
    networks:
    - default
    #- data
networks:
  data:
    external: true
    name: ${DATA_NET:-data}
volumes:
  redis-data:
    driver: local
