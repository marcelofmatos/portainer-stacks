# Stack "comfyui" — variante Docker Compose (host standalone). Variáveis, portas e uso no README.
# Pré-requisito: crie as redes externas usadas pela stack (ex.: docker network create web; e data/ldap se aplicável).
services:
  comfyui:
    restart: unless-stopped
    image: ${COMFYUI_IMAGE:-yanwk/comfyui-boot:latest}
    networks:
    - default
    - web
    # Acesso direto opcional (publica a porta no host, sem passar pelo Traefik).
    # Descomente se precisar bypassar o proxy. Veja a nota no README sobre segurança.
    # ports:                 # sugestão: 8108 -> porta 8188 do container
    #   - "${COMFYUI_EXTERNAL_PORT:-8108}:8188"
    volumes:
    - comfyui-data:${COMFYUI_DATA_PATH:-/root}
    labels:
    - traefik.enable=true
    - traefik.http.routers.comfyui.rule=Host(`${COMFYUI_FQDN}`)
    - traefik.http.routers.comfyui.entrypoints=websecure
    - traefik.http.routers.comfyui.tls=true
    - traefik.http.routers.comfyui.tls.certresolver=letsencryptresolver
    - traefik.http.routers.comfyui.middlewares=comfyui-auth
    - traefik.http.middlewares.comfyui-auth.basicauth.users=${COMFYUI_AUTH_BASIC}
    - traefik.http.services.comfyui.loadbalancer.server.port=8188
    - traefik.docker.network=${PROXY_NET:-web}
networks:
  web:
    external: true
    name: ${PROXY_NET:-web}
  default:
    driver: bridge
volumes:
  comfyui-data:
    driver: local
