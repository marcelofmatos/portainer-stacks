# Stack "sygnal" — Sygnal (push gateway de referencia do Matrix.org), variante Docker
# Compose (host standalone).
#
# Autocontido: a config e a credencial do FCM vivem no volume sygnal-config montado em
# /sygnal (/sygnal/sygnal.yaml + /sygnal/firebase-service-account.json).
#
# ATENCAO: o Sygnal recusa iniciar sem pelo menos 1 app valido em `apps:` e sem uma
# credencial de FCM valida (falha JA na inicializacao, nao so ao enviar). Um volume
# novo nasce VAZIO -> popule-o ANTES do primeiro `docker compose up` (ver README, secao
# Uso) pra nunca entrar em loop de restart.
# Pre-req: rede externa `web` (docker network create web).
# Obrigatoria: SYGNAL_FQDN.
# Porte: Leve (64 MB -> 256 MB RAM)

services:
  push:
    image: matrixdotorg/sygnal:${SYGNAL_IMAGE_TAG:-v0.17.0}
    restart: unless-stopped
    environment:
      # Os 2 arquivos OBRIGATORIOS dentro do volume sygnal-config (ver Uso no README).
      # SYGNAL_CONF e lido pelo proprio Sygnal; SYGNAL_FCM_CREDENTIAL_FILE e so
      # informativo aqui (o caminho real vem do service_account_file no sygnal.yaml).
      - SYGNAL_CONF=/sygnal/sygnal.yaml
      - SYGNAL_FCM_CREDENTIAL_FILE=/sygnal/firebase-service-account.json
    volumes:
      - sygnal-config:/sygnal
    networks:
      - default
      - web
    # A imagem oficial define HEALTHCHECK com `curl`, que nao existe nela (container
    # fica "unhealthy" pra sempre e o Traefik para de rotear). Sobrescreve com um
    # check via python3 (garantido presente, e' o runtime do proprio Sygnal).
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 5000), 2)"]
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 3
    # Acesso direto opcional (publica a porta no host, sem passar pelo Traefik).
    # ports:
    #   - "${SYGNAL_EXTERNAL_PORT:-8105}:5000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.sygnal.rule=Host(`${SYGNAL_FQDN}`)
      - traefik.http.routers.sygnal.entrypoints=websecure
      - traefik.http.routers.sygnal.tls=true
      - traefik.http.routers.sygnal.tls.certresolver=letsencryptresolver
      - traefik.http.services.sygnal.loadbalancer.server.port=5000
      - traefik.docker.network=${PROXY_NET:-web}

networks:
  web:
    external: true
    name: ${PROXY_NET:-web}
  default:
    driver: bridge

volumes:
  sygnal-config:
    driver: local
