# Stack "sygnal" — Sygnal (push gateway de referencia do Matrix.org) em Docker Swarm.
# Proxy: Traefik v3 na rede externa `web`, TLS Let's Encrypt (certresolver=letsencryptresolver).
#
# Recebe o POST /_matrix/push/v1/notify que QUALQUER homeserver Matrix manda quando um
# usuario tem uma notificacao pendente, e entrega de fato o push via Firebase Cloud
# Messaging (Android, e iOS por relay FCM -> APNs) e/ou direto na APNs da Apple.
# Serve qualquer cliente Matrix que registre um pusher HTTP apontando pra esta stack
# (ex.: Element, FluffyChat e forks) — nao e especifico de nenhum app.
#
# Toda customizacao e feita por variaveis de ambiente (ver README e bloco abaixo).
# Obrigatoria: SYGNAL_FQDN.
#
# Autocontido: a config e a credencial do FCM vivem num volume (sygnal-config) montado
# em /sygnal — dentro dele ficam /sygnal/sygnal.yaml e /sygnal/firebase-service-account.json.
#
# ATENCAO: o Sygnal recusa iniciar sem pelo menos 1 app valido em `apps:` e sem uma
# credencial de FCM valida (falha JA na inicializacao, nao so ao enviar). Um volume
# novo nasce VAZIO -> popule-o ANTES do primeiro deploy (ver README, secao Uso) pra
# nunca entrar em loop de restart.
#
# NOTA (volumes em Swarm): volumes sao locais ao no; em cluster multi-worker, fixe
# WORKER_HOSTNAME e descomente o constraint de hostname.
# Porte: Leve (64 MB -> 256 MB RAM)
# Hardware (1 replica): minimo 0.25 vCPU · 128 MB RAM · 1 GB disco

services:
  sygnal:
    image: matrixdotorg/sygnal:${SYGNAL_IMAGE_TAG:-v0.17.0}
    environment:
      # Os 2 arquivos OBRIGATORIOS dentro do volume sygnal-config (ver Uso no README).
      # SYGNAL_CONF e lido pelo proprio Sygnal; SYGNAL_FCM_CREDENTIAL_FILE e so
      # informativo aqui (o caminho real vem do service_account_file no sygnal.yaml).
      - SYGNAL_CONF=/sygnal/sygnal.yaml
      - SYGNAL_FCM_CREDENTIAL_FILE=/sygnal/firebase-service-account.json
    volumes:
      - sygnal-config:/sygnal
    networks:
      - default
      - web
    # Acesso direto opcional (modo host publica a porta no no, sem passar pelo Traefik).
    # Util para testar o gateway antes do DNS/TLS estarem prontos. Descomente se precisar.
    # ports:
    #   - target: 5000
    #     published: ${SYGNAL_EXTERNAL_PORT:-8105}
    #     mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
          # - node.hostname == ${WORKER_HOSTNAME:-}   # fixe o no: volume e local
      labels:
        - traefik.enable=true
        - traefik.http.routers.sygnal.rule=Host(`${SYGNAL_FQDN}`)
        - traefik.http.routers.sygnal.entrypoints=websecure
        - traefik.http.routers.sygnal.tls=true
        - traefik.http.routers.sygnal.tls.certresolver=letsencryptresolver
        - traefik.http.services.sygnal.loadbalancer.server.port=5000

networks:
  web:
    external: true
    name: ${PROXY_NET:-web}
  default:
    driver: overlay

volumes:
  sygnal-config:
    driver: local
