# Stack "wordpress" — variante Docker Compose (host standalone). Variáveis, portas e uso no README.
# Pré-requisito: crie as redes externas usadas pela stack (ex.: docker network create web; e data/ldap se aplicável).
services:
  wordpress:
    restart: unless-stopped
    image: wordpress:${WORDPRESS_IMAGE_TAG:-php8.3-apache}
    networks:
    - default
    - web
    environment:
    - WORDPRESS_DB_HOST=${WORDPRESS_DB_HOST:-db}
    - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:-wordpress}
    - WORDPRESS_DB_USER=${WORDPRESS_DB_USER:-wordpress}
    - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD}
    - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
    - WORDPRESS_CONFIG_EXTRA=${WORDPRESS_CONFIG_EXTRA:-}
    # Acesso direto opcional (publica a porta no host, sem passar pelo Traefik).
    # Descomente se precisar bypassar o proxy. Veja a nota no README sobre segurança.
    # ports:                 # sugestão: 8163 -> porta 80 do container
    #   - "${WORDPRESS_EXTERNAL_PORT:-8163}:80"
    volumes:
    - wordpress-data:/var/www/html
    labels:
    - traefik.enable=true
    - traefik.http.routers.wordpress.rule=Host(`${WORDPRESS_FQDN}`)
    - traefik.http.routers.wordpress.entrypoints=websecure
    - traefik.http.routers.wordpress.tls=true
    - traefik.http.routers.wordpress.tls.certresolver=letsencryptresolver
    - traefik.http.services.wordpress.loadbalancer.server.port=80
    - caddy=${WORDPRESS_FQDN}
    - caddy.reverse_proxy={{upstreams 80}}
    - traefik.docker.network=${PROXY_NET:-web}
  db:
    restart: unless-stopped
    image: mariadb:${WORDPRESS_DB_IMAGE_TAG:-11}
    networks:
    - default
    #- data
    environment:
    - MARIADB_DATABASE=${WORDPRESS_DB_NAME:-wordpress}
    - MARIADB_USER=${WORDPRESS_DB_USER:-wordpress}
    - MARIADB_PASSWORD=${WORDPRESS_DB_PASSWORD}
    - MARIADB_ROOT_PASSWORD=${WORDPRESS_DB_ROOT_PASSWORD}
    # Acesso externo opcional (publica a porta no host). Descomente se precisar
    # conectar de fora do host. Veja a nota no README sobre segurança.
    # ports:                 # sugestão: 3308 -> porta 3306 do container
    #   - "${WORDPRESS_DB_EXTERNAL_PORT:-3308}:3306"
    volumes:
    - db-data:/var/lib/mysql
networks:
  web:
    external: true
    name: ${PROXY_NET:-web}
  data:
    external: true
    name: ${DATA_NET:-data}
  default:
    driver: bridge
volumes:
  wordpress-data:
    driver: local
  db-data:
    driver: local
